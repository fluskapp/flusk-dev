name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Build (engine)
        run: npm run build
      - name: Build (app)
        run: npm run build:app
      # The engine's tools and tests assume a POSIX userland (bash, grep, cat
      # in tool subprocesses). Windows still builds and typechecks here, and
      # the release workflow packages it — but the unit suite is honest about
      # what it can promise there until Windows support is scheduled work.
      - name: Test
        run: npm test
        if: runner.os != 'Windows'
      - name: Standards
        run: npm run standards
        if: runner.os != 'Windows'
      - name: Design
        run: npm run design
        if: runner.os != 'Windows'

  rust:
    # Becomes required once crates/ lands (Phase 5); green no-op until then.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cargo test + clippy
        run: |
          if [ -f crates/Cargo.toml ] || [ -f Cargo.toml ]; then
            cargo test --workspace --manifest-path "$( [ -f Cargo.toml ] && echo Cargo.toml || echo crates/Cargo.toml )"
            cargo clippy --workspace --manifest-path "$( [ -f Cargo.toml ] && echo Cargo.toml || echo crates/Cargo.toml )" -- -D warnings
          else
            echo "no Rust workspace yet"
          fi
